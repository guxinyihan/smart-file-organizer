name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install development and watch dependencies
        run: python -m pip install -e ".[dev,watch]"
      - name: Run full disposable-directory suite
        run: python -m pytest -q
      - name: Check CLI and packaged rules
        run: |
          smartsort --help
          smartsort rules validate
